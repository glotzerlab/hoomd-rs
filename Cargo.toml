[workspace]

resolver = "3"
members = ["benchmarks",
           "examples",
           "hoomd-bevy",
           "hoomd-derive",
           "hoomd-geometry",
           "hoomd-gsd",
           "hoomd-interaction",
           "hoomd-linear-algebra",
           "hoomd-manifold",
           "hoomd-mc",
           "hoomd-md",
           "hoomd-microstate",
           "hoomd-simulation",
           "hoomd-spatial",
           "hoomd-utility",
           "hoomd-vector",
           "tools/build-wasm-doc-examples",
           "hoomd-rand"
          ]

# Include only core hoomd simulation crates by default so that `cargo build`,
# `cargo test` and similar commands operate only on the core code by default.
# The `hoomd-bevy` crate depends on `bevy` which takes a long time to download
# and compile.
default-members = ["examples",
                   "hoomd-derive",
                   "hoomd-geometry",
                   "hoomd-gsd",
                   "hoomd-interaction",
                   "hoomd-linear-algebra",
                   "hoomd-manifold",
                   "hoomd-mc",
                   "hoomd-md",
                   "hoomd-microstate",
                   "hoomd-simulation",
                   "hoomd-spatial",
                   "hoomd-utility",
                   "hoomd-vector",
                   "hoomd-rand"
                  ]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
homepage = "https://glotzerlab.engin.umich.edu"
documentation = "https://hoomd-rs.readthedocs.io"
repository = "https://github.com/glotzerlab/hoomd-rs"
license = "BSD-3-Clause"
keywords = ["molecular-dynamics", "monte-carlo", "simulation"]
categories = ["science"]

[workspace.dependencies]
# hooomd-rs crates
# These lines must have 'version = "X.Y.Z", path' *in that order* to work with bump-my-version.
hoomd-bevy = { version = "1.2.0", path = "hoomd-bevy" }
hoomd-derive = { version = "1.2.0", path = "hoomd-derive" }
hoomd-geometry = { version = "1.2.0", path = "hoomd-geometry" }
hoomd-gsd = { version = "1.2.0", path = "hoomd-gsd" }
hoomd-interaction = { version = "1.2.0", path = "hoomd-interaction" }
hoomd-linear-algebra = { version = "1.2.0", path = "hoomd-linear-algebra" }
hoomd-manifold = { version = "1.2.0", path = "hoomd-manifold" }
hoomd-mc = { version = "1.2.0", path = "hoomd-mc" }
hoomd-md = { version = "1.2.0", path = "hoomd-md"}
hoomd-microstate = { version = "1.2.0", path = "hoomd-microstate" }
hoomd-simulation = { version = "1.2.0", path = "hoomd-simulation" }
hoomd-spatial = { version = "1.2.0", path = "hoomd-spatial" }
hoomd-utility = { version = "1.2.0", path = "hoomd-utility" }
hoomd-vector = { version = "1.2.0", path = "hoomd-vector" }
hoomd-rand = { version = "1.2.0", path = "hoomd-rand" }

# Dev dependencies
assert2 = "=0.4.0"
divan = "=0.1.21"
paste = "=1.0.15"
rand_sfc = "=0.2.0"
rstest = "=0.26.1"
tempfile = "=3.27.0"
strum = "=0.28.0"
strum_macros = "=0.28.0"

# Dependencies used internally
clap = {version = "4.5.48", features = ["derive"]}
clap-verbosity-flag = "3.0.3"
env_logger = "0.11.8"
itertools = "0.15.0"
log = "0.4.28"
postcard = {version = "1.1.3", default-features = false, features = ["use-std"]}
rand_distr = "0.6.0"
rayon = "1.11.0"
robust = "1.2.0"
rustc-hash = "2.1.1"
serde_with = "3.16.1"
wildmatch = "2.4.0"
parquet = { version = "59.0.0", default-features=false }
parquet_derive = { version = "59.0.0", default-features=false }

# Dependencies exposed via Public APIs.
anyhow = "1.0.100"
approxim = "0.6.6"
arrayvec = { version = "0.7.6", features = ["serde"] }
num = { version = "0.4.3", features = ["serde"] }
rand = { version = "0.10.0", default-features=false, features = ["std", "std_rng"] }
serde = { version = "1.0.228", features = ["derive"]}
thiserror = "2.0.12"

# Bevy and bevy-adjacent dependencies
bevy_egui = "0.41.0"
wayland-sys = "0.31.8"

[workspace.dependencies.bevy]
version = "0.19.0"
default-features = false

# Include all 2d and 3d features, but NOT audio or gamepad support.
# (gamepad requires libudev on Linux)
features = ["default_app",
            "bevy_winit",
            "default_font",
            "multi_threaded",
            "webgl2",
            "x11",
            "wayland",
            "sysinfo_plugin",
            "2d_bevy_render",
            "3d_bevy_render",
            "ui_api",
            "ui_bevy_render",
            "scene",
            "picking",
            "bevy_dev_tools"]

[workspace.dependencies.bevy_diagnostic]
version = "0.19.0"

[workspace.dependencies.bevy_winit]
version = "0.19.0"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Bevy pulls in many duplicate dependencies and there is nothing we can do about it.
multiple_crate_versions = "allow"

# allow some pedantic rules
cast_precision_loss = "allow"
float_cmp = "allow"
similar_names = "allow"
inline_always = "allow"
must_use_candidate = "allow"

# opt-in to restrictions
allow_attributes_without_reason = "warn"
exhaustive_enums = "warn"
impl_trait_in_params = "warn"
missing_docs_in_private_items = "warn"
missing_inline_in_public_items = "warn"
panic = "warn"
partial_pub_fields = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
todo = "warn"
unwrap_used = "warn"
# unwrap_used is warn, but expect_used is allowed. Ideally, we would like to warn on expect_used,
# but the use of expect is unavoidable. As a rule, `expect` should only be used when it will panic
# due to a bug IN HOOMD-RS. `expect` should never be used to validate input from the caller,
# or panic as a result of the caller's action. Such cases should return a `Result` or `Option`
# type as appropriate and allow the caller to handle the error appropriately.

# lints currently in nursery
fallible_impl_from = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"

[workspace.metadata.typos]
default.extend-words = { ratatui = "ratatui" }

# Optimize for size in wasm builds
[profile.release-wasm]
opt-level = 'z'
lto = 'thin'
codegen-units = 1
inherits = "release"

# Reduce the size of binaries generated in CI builds.
[profile.ci]
inherits = "release"
opt-level = 'z'
strip = true
codegen-units = 256

# Build settings to profile benchmarks
[profile.profile]
inherits = "release"
debug = true

# Bevy is extremely slow in debug builds, build it with optimizations
# to avoid this: https://bevy.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations
# Explicitly list all bevy packates as we may want to be able to debug
# other dependencies.
[profile.dev.package.bevy]
opt-level = 3
[profile.dev.package.bevy_a11y]
opt-level = 3
[profile.dev.package.bevy_android]
opt-level = 3
