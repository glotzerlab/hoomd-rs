[tool.bumpversion]
current_version = "1.0.2"

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = """
[workspace.package]
version = "{current_version}"
"""
replace = """
[workspace.package]
version = "{new_version}"
"""

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = 'version = "{current_version}", path'
replace = 'version = "{new_version}", path'

[[tool.bumpversion.files]]
filename = "README.md"
search = "/{current_version}/"
replace = "/{new_version}/"

