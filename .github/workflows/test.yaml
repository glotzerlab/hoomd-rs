name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
    - trunk

  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  unit_test:
    name: Unit test [rust-${{ matrix.rust }}-${{ matrix.os }}-${{ matrix.target || 'native' }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Test the latest Rust on all platforms.
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
        rust:
          - 1.94.0
        target:
         - ''

        include:
        - os: ubuntu-24.04
          rust: 1.94.0
          target: wasm32-unknown-unknown

        # Test MSRV
        - os: ubuntu-24.04
          rust: 1.91.0
          target: ''

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Configure Rust
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
      with:
        toolchain: ${{ matrix.rust }}
        targets: ${{ matrix.target }}
    - name: Check rust installation
      run: rustc -vV
    # rust-cache already includes a Cargo.lock hash in the key. However, it
    # eagerly restores caches with previous Cargo.lock files. This causes
    # multiple builds to be cached in target/ increasing the cache usage
    # dramatically. Add the Cargo.lock hash again in the key portion to
    # prevent this restoration.
    - name: Cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        key: ${{ matrix.target || 'native' }}-${{ hashFiles('Cargo.lock') }}
        cache-bin: false
        save-if: ${{ github.ref != 'refs/heads/trunk' }}

    - name: Build [default features]
      run: >
        cargo build
        --profile=ci
        --locked
        --workspace
        --lib
        --bins
        --tests
        --examples
        ${{ matrix.target != '' && '--target' || '' }} ${{ matrix.target }}
        --verbose
      if: ${{ matrix.target == '' }}

    - name: Build [all features]
      run: >
        cargo build
        --profile=ci
        --all-features
        --locked
        --workspace
        --lib
        --bins
        --tests
        --examples
        ${{ matrix.target != '' && '--target' || '' }} ${{ matrix.target }}
        --verbose

    - name: Run tests
      run: >
        cargo test
        --profile=ci
        --all-features
        --locked
        --workspace
        --verbose
      if: ${{ matrix.target == '' }}

    - name: Build API documentation
      run: >
        cargo doc
        --profile=ci
        --all-features
        --locked
        --workspace
        --no-deps
      if: ${{ matrix.target == '' }}

    - name: Run benchmarks
      run: >
        cargo bench
        --profile=ci
        --all-features
        --locked
        --workspace
      if: ${{ matrix.target == '' }}

    - name: Show target directory size
      run: du -hsc target/*

  semver_checks:
    name: Validate semantic version
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Run cargo-semver-checks
      uses: obi1kenobi/cargo-semver-checks-action@5b298c9520f7096a4683c0bd981a7ac5a7e249ae # v2.8
      with:
        verbose: true

  tests_complete:
    name: All tests
    if: always()
    needs: [unit_test]
    runs-on: ubuntu-latest

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
    - name: Done
      run: exit 0
