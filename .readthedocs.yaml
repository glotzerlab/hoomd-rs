version: 2
build:
  os: "ubuntu-24.04"
  tools:
    rust: "1.86"
  commands:
    # Build the API documentation
    - RUSTDOCFLAGS="--html-in-header katex.html" cargo doc --no-deps
    - mkdir -p $READTHEDOCS_OUTPUT/html/api
    - mv target/doc/* $READTHEDOCS_OUTPUT/html/api
    - touch $READTHEDOCS_OUTPUT/html/index.html
