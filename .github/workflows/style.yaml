name: Style

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
    - trunk

  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  cargo-check-clippy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Remove native build configuration
      run: rm .cargo/config.toml
    - name: Configure Rust
      run: rustup toolchain install 1.95.0 --component clippy
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        key: ${{ hashFiles('Cargo.lock') }}
        cache-bin: false
        save-if: ${{ github.ref != 'refs/heads/trunk' }}

    # Unfortunately, it is not currently possible to mark warnings as errors with cargo check:
    # https://github.com/rust-lang/cargo/issues/8424#issuecomment-1915265827
    # The workaround does not work for hoomd-rs because we set rust configuration options.
    #
    # Check all targets in debug and release modes
    - name: cargo check [native]
      run: >
        cargo check
        --profile ci
        --locked
        --workspace
        --all-targets
        --all-features

    - name: cargo clippy [native]
      run: >
        cargo clippy
        --profile ci
        --locked
        --workspace
        --all-targets
        --all-features
        -- -Dwarnings

    # Check the examples in wasm builds with and without webgpu
    - name: cargo check [wasm32, features="bevy"]
      run: >
        cargo check
        --profile ci
        --features "bevy"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
    - name: cargo check [wasm32, features="bevy,webgpu"]
      run: >
        cargo check
        --profile ci
        --features "bevy,webgpu"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown

    - name: cargo clippy [wasm32, features="bevy"]
      run: >
        cargo clippy
        --profile ci
        --features "bevy"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        -- -Dwarnings
    - name: cargo clippy [wasm32, features="bevy,webgpu"]
      run: >
        cargo clippy
        --profile ci
        --features "bevy,webgpu"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        -- -Dwarnings

  cargo-fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Remove native build configuration
      run: rm .cargo/config.toml
    - name: Configure Rust
      run: rustup toolchain install nightly-2025-09-17 --component rustfmt
    - run: cargo +nightly-2025-09-17 fmt --all --check

  prek:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: prek
      uses: j178/prek-action@6ad80277337ad479fe43bd70701c3f7f8aa74db3 # v2.0.3
      with:
        prek-version: '0.3.8'

  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
      with:
        advanced-security: false

  # This job is used to provide a single requirement for branch merge conditions.
  tests_complete:
    name: All style checks
    if: always()
    needs: [cargo-check-clippy, cargo-fmt, prek, zizmor]
    runs-on: ubuntu-24.04

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< "${NEEDS}"
      env:
        NEEDS: ${{ toJson(needs) }}
    - run: exit 0
