require_https = true
cache = true
exclude = [
  '^https://github.com/glotzerlab/hoomd-rs$',
  '.*dispatcher#setting-the-default-subscriber$',  # Invalid link generated by bevy docs
  '.*TypePath#anonymity$',  # Invalid link generated by bevy docs
  '^https://docs.rs/glam.*neon', # Invalid link generated by glam docs on Mac
]
exclude_path = [
    "\\.txt$", # skip .txt extensions
    ".*api/static.files/", # skip static files packaged by rustdoc
]
