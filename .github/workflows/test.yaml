name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
    - trunk

  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  start_action_runners:
    name: Start
    uses: glotzerlab/jetstream2-admin/.github/workflows/start.yaml@f6746b0a76c06e45cc1b0c5e32576dfa2c7d2d8c # v1.5.1
    secrets: inherit
    with:
      number: 8

  unit_test:
    name: Unit test [rust-${{ matrix.rust }}-${{ matrix.os }}-${{ matrix.target || 'native' }}]
    runs-on: [self-hosted, jetstream2, CPU]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          # Disable macOS tests to avoid burning through free GitHub Actions minutes.
          # TODO: Include Mac and Windows tests after the project made public.
          # - macos-14
        rust:
          - 1.89.0
          - 1.93.0
        target:
         - ''

        include:
        # Add a WASM build.
        - os: ubuntu-24.04
          rust: 1.93.0
          target: wasm32-unknown-unknown

    steps:
    # These steps are needed on self-hosted runners and can be removed on GitHub runners
    - name: Clean workspace
      run: ( shopt -s dotglob nullglob; rm -rf ./* )
    - name: Add cargo PATH
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    # This code is needed on GitHub Hosted runners, disable for now while we use private runners.
    # - name: Update rust
    #   run: rustup install ${{ matrix.rust }} --no-self-update
    # - name: Install target
    #   run: rustup target install ${{ matrix.target }} --toolchain ${{ matrix.rust }}
    #   if: ${{ matrix.target != '' }}
    - name: Set default target
      run: rustup default ${{ matrix.rust }}
    - name: Check rust installation
      run: rustc -vV
    # rust-cache already includes a Cargo.lock hash in the key. However, it
    # eagerly restores caches with previous Cargo.lock files. This causes
    # multiple builds to be cached in target/ increasing the cache usage
    # dramatically. Add the Cargo.lock hash again in the key portion to
    # prevent this restoration.
    - name: Cache
      uses: Swatinem/rust-cache@c676846f29d98ff6b0106d3608c7ffd4048af17b # v2.9.0
      with:
        key: ${{ matrix.target || 'native' }}-${{ hashFiles('Cargo.lock') }}
        cache-bin: false

    - name: Build [default features]
      run: >
        cargo build
        --profile=ci
        --locked
        --workspace
        --lib
        --bins
        --tests
        --examples
        ${{ matrix.target != '' && '--target' || '' }} ${{ matrix.target }}
        --verbose
      if: ${{ matrix.target == '' }}

    - name: Build [all features]
      run: >
        cargo build
        --profile=ci
        --all-features
        --locked
        --workspace
        --lib
        --bins
        --tests
        --examples
        ${{ matrix.target != '' && '--target' || '' }} ${{ matrix.target }}
        --verbose

    - name: Run tests
      run: >
        cargo test
        --profile=ci
        --all-features
        --locked
        --workspace
        --verbose
      if: ${{ matrix.target == '' }}

    - name: Build API documentation
      run: >
        cargo doc
        --profile=ci
        --all-features
        --locked
        --workspace
        --no-deps
      if: ${{ matrix.target == '' }}

    - name: Run benchmarks
      run: >
        cargo bench
        --profile=ci
        --all-features
        --locked
        --workspace
      if: ${{ matrix.target == '' }}

    - name: Show target directory size
      run: du -hsc target/*

  tests_complete:
    name: All tests
    if: always()
    needs: [unit_test]
    runs-on: ubuntu-latest

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
    - name: Done
      run: exit 0
