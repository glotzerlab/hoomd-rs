name: Style

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
    - trunk

  workflow_dispatch:

permissions: {}

env:
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  cargo-check-clippy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Remove native build configuration
      run: rm .cargo/config.toml
    - name: Configure Rust
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: 1.100.0
        targets: wasm32-unknown-unknown
        components: clippy
    - name: Check rust installation
      run: rustup toolchain list
    # extra toolchains occur on some actions runners but not others, resulting in cache misses
    - name: Remove extra rust toolchains
      run: >
        for toolchain in $(rustup toolchain list | grep -v default); do
            rustup toolchain uninstall "$toolchain"
        done
    - name: Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: clippy-${{ hashFiles('Cargo.lock') }}
        cache-bin: false
        add-job-id-key: false
        save-if: ${{ github.ref != 'refs/heads/trunk' }}

    # Check all targets in debug and release modes
    - name: cargo check [native]
      run: >
        cargo check
        --profile ci
        --locked
        --workspace
        --all-targets
        --all-features
        --keep-going

    - name: cargo clippy [native]
      run: >
        cargo clippy
        --profile ci
        --locked
        --workspace
        --all-targets
        --all-features
        --keep-going

    # Check the examples in wasm builds with and without webgpu
    - name: cargo check [wasm32, features="bevy"]
      run: >
        cargo check
        --profile ci
        --features "bevy"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        --keep-going

    - name: cargo check [wasm32, features="bevy,webgpu"]
      run: >
        cargo check
        --profile ci
        --features "bevy,webgpu"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        --keep-going

    - name: cargo clippy [wasm32, features="bevy"]
      run: >
        cargo clippy
        --profile ci
        --features "bevy"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        --keep-going

    - name: cargo clippy [wasm32, features="bevy,webgpu"]
      run: >
        cargo clippy
        --profile ci
        --features "bevy,webgpu"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        --keep-going

  cargo-fmt:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Remove native build configuration
      run: rm .cargo/config.toml
    - name: Configure Rust
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: nightly-2025-09-17
        components: rustfmt
    - run: cargo +nightly-2025-09-17 fmt --all --check

  prek:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: prek
      uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
      with:
        prek-version: 'v0.5.11'

  zizmor:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
      with:
        advanced-security: false

  # This job is used to provide a single requirement for branch merge conditions.
  tests_complete:
    name: All style checks
    if: always()
    needs: [cargo-check-clippy, cargo-fmt, prek, zizmor]
    runs-on: ubuntu-26.04

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< "${NEEDS}"
      env:
        NEEDS: ${{ toJson(needs) }}
    - run: exit 0
