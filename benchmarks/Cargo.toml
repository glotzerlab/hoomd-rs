[package]
name = "benchmarks"
categories.workspace = true
description = "Measure hoomd-rs performance for typical simulations."
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Do not publish benchmarks to crates.io
publish = false

[lints]
workspace = true

[features]
default = ["parallel"]
parallel = [
    "dep:anyhow",
    "dep:clap",
    "dep:clap-verbosity-flag",
    "dep:env_logger",
    "dep:hoomd-geometry",
    "dep:hoomd-interaction",
    "dep:hoomd-mc",
    "dep:hoomd-md",
    "dep:hoomd-microstate",
    "dep:hoomd-rand",
    "dep:hoomd-simulation",
    "dep:hoomd-spatial",
    "dep:hoomd-utility",
    "dep:hoomd-vector",
    "dep:log",
    "dep:parquet",
    "dep:parquet_derive",
    "dep:postcard",
    "dep:rand",
    "dep:serde",
    "dep:wildmatch",
    "hoomd-mc/parallel",
    "hoomd-md/parallel",
    "hoomd-utility/parallel",
]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["parallel"]

[dependencies]
parquet = { workspace = true, optional = true }
parquet_derive = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

hoomd-geometry = { workspace = true, optional = true }
hoomd-interaction = { workspace = true, optional = true }
hoomd-mc = { workspace = true, optional = true }
hoomd-md = { workspace = true, optional = true }
hoomd-microstate = { workspace = true, optional = true }
hoomd-rand = { workspace = true, optional = true }
hoomd-simulation = { workspace = true, optional = true }
hoomd-spatial = { workspace = true, optional = true }
hoomd-utility = { workspace = true, optional = true }
hoomd-vector = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
clap-verbosity-flag = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
log = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
wildmatch = { workspace = true, optional = true }
