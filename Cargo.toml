[workspace]

resolver = "3"
members = ["benchmarks",
           "examples",
           "hoomd-bevy",
           "hoomd-geometry",
           "hoomd-gsd",
           "hoomd-interaction",
           "hoomd-linear-algebra",
           "hoomd-manifold",
           "hoomd-mc",
           "hoomd-microstate",
           "hoomd-simulation",
           "hoomd-spatial",
           "hoomd-utility",
           "hoomd-vector",
           "tools/build-wasm-doc-examples",
           "threefry"
          ]

# Include only core hoomd simulation crates by default so that `cargo build`,
# `cargo test` and similar commands operate only on the core code by default.
# The `hoomd-bevy` crate depends on `bevy` which takes a long time to download
# and compile.
default-members = ["examples",
                   "hoomd-geometry",
                   "hoomd-gsd",
                   "hoomd-interaction",
                   "hoomd-linear-algebra",
                   "hoomd-manifold",
                   "hoomd-mc",
                   "hoomd-microstate",
                   "hoomd-simulation",
                   "hoomd-spatial",
                   "hoomd-utility",
                   "hoomd-vector",
                   "threefry"
                  ]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
homepage = "https://glotzerlab.engin.umich.edu"
repository = "https://github.com/glotzerlab/hoomd-rs"
license = "BSD-3-Clause"
keywords = ["molecular-dynamics", "monte-carlo", "simulation"]
categories = ["science"]

[workspace.dependencies]
# Subcrates
hoomd-bevy = { path = "hoomd-bevy" }
hoomd-geometry = { path = "hoomd-geometry" }
hoomd-gsd = { path = "hoomd-gsd" }
hoomd-interaction = { path = "hoomd-interaction" }
hoomd-linear-algebra = { path = "hoomd-linear-algebra" }
hoomd-manifold = { path = "hoomd-manifold" }
hoomd-mc = { path = "hoomd-mc" }
hoomd-microstate = { path = "hoomd-microstate" }
hoomd-simulation = { path = "hoomd-simulation" }
hoomd-spatial = { path = "hoomd-spatial" }
hoomd-utility = { path = "hoomd-utility" }
hoomd-vector = { path = "hoomd-vector" }
threefry = { path = "threefry" }

# Common dev dependencies
anyhow = "=1.0.100"
divan = "=0.1.21"
paste = "=1.0.15"
rstest = "=0.26.1"
tempfile = "=3.22.0"

# Dependencies used internally
clap = {version = "4.5.48", features = ["derive"]}
clap-verbosity-flag = "3.0.3"
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.28"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0.145"
wildmatch = "2.4.0"

# Dependencies exposed via Public APIs.
approxim = "0.6.6"
num = "0.4.3"
rand = { version = "0.9.0", default-features=false, features = ["std", "std_rng"] }
rand_distr = "0.5.1"
thiserror = "2.0.12"
tinyvec = "1.9.0"

# Bevy and bevy-adjacent dependencies
bevy_egui = "0.36.0"
[workspace.dependencies.bevy]
version = "0.16.1"
default-features = false
features = ["async_executor",
            "bevy_asset",
            "bevy_color",
            "bevy_log",
            "bevy_render",
            "bevy_sprite",
            "bevy_state",
            "bevy_text",
            "bevy_ui",
            "bevy_window",
            "bevy_winit",
            "default_font",
            "multi_threaded",
            "png",
            "std",
            "sysinfo_plugin",
            "webgl2",
            "x11",
            "bevy_dev_tools"]

[workspace.dependencies.bevy_diagnostic]
version = "0.16.1"

[workspace.dependencies.bevy_winit]
version = "0.16.1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Bevy pulls in many duplicate dependencies and there is nothing we can do about it.
multiple_crate_versions = "allow"

# allow some pedantic rules
cast_precision_loss = "allow"
float_cmp = "allow"
similar_names = "allow"

# opt-in to restrictions
allow_attributes_without_reason = "warn"
exhaustive_enums = "warn"
impl_trait_in_params = "warn"
missing_docs_in_private_items = "warn"
missing_inline_in_public_items = "warn"
mod_module_files = "warn"
panic = "warn"
partial_pub_fields = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
todo = "warn"
unwrap_used = "warn"
# unwrap_used is warn, but expect_used is allowed. Ideally, we would like to warn on expect_used,
# but the use of expect is unavoidable. As a rule, `expect` should only be used when it will panic
# due to a bug IN HOOMD-RS. `expect` should never be used to validate input from the caller,
# or panic as a result of the caller's action. Such cases should return a `Result` or `Option`
# type as appropriate and allow the caller to handle the error appropriately.

# lints currently in nursery
fallible_impl_from = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"

[workspace.metadata.typos]
default.extend-words = { ratatui = "ratatui" }

[workspace.metadata.docs.rs]
# TODO: Check that this works after release. It may need to be in package.metadata
# https://docs.rs/about/metadata
rustdoc-args = [ "--html-in-header", "katex.html" ]

# Optimize for size in wasm builds
[profile.release-wasm]
opt-level = 'z'
lto = 'thin'  # TODO: Switch back to true after migrating to GitHub Pages for docs.
codegen-units = 1
inherits = "release"

# Reduce the size of binaries generated in CI builds.
[profile.ci]
inherits = "release"
opt-level = 'z'
strip = true
codegen-units = 256

# Build settings to profile benchmarks
[profile.profile]
inherits = "release"
debug = true

# Bevy is extremely slow in debug builds, build it with optimizations
# to avoid this: https://bevy.org/learn/quick-start/getting-started/setup/#compile-with-performance-optimizations
# Explicitly list all bevy packates as we may want to be able to debug
# other dependencies.
[profile.dev.package.bevy]
opt-level = 3
[profile.dev.package.bevy_diagnostic]
opt-level = 3
[profile.dev.package.bevy_winit]
opt-level = 3

