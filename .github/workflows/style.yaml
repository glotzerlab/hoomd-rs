name: Style

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
    - trunk

  workflow_dispatch:

permissions: {}

env:
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  cargo-check-clippy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Remove native build configuration
      run: rm .cargo/config.toml
    - name: Configure Rust
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: 1.97.0
        targets: wasm32-unknown-unknown
        components: clippy
    - name: Cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        key: ${{ hashFiles('Cargo.lock') }}
        cache-bin: false
        save-if: ${{ github.ref != 'refs/heads/trunk' }}

    # Check all targets in debug and release modes
    - name: cargo check [native]
      run: >
        cargo check
        --profile ci
        --locked
        --workspace
        --all-targets
        --all-features
        --keep-going

    - name: cargo clippy [native]
      run: >
        cargo clippy
        --profile ci
        --locked
        --workspace
        --all-targets
        --all-features
        --keep-going

    # Check the examples in wasm builds with and without webgpu
    - name: cargo check [wasm32, features="bevy"]
      run: >
        cargo check
        --profile ci
        --features "bevy"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        --keep-going

    - name: cargo check [wasm32, features="bevy,webgpu"]
      run: >
        cargo check
        --profile ci
        --features "bevy,webgpu"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        --keep-going

    - name: cargo clippy [wasm32, features="bevy"]
      run: >
        cargo clippy
        --profile ci
        --features "bevy"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        --keep-going

    - name: cargo clippy [wasm32, features="bevy,webgpu"]
      run: >
        cargo clippy
        --profile ci
        --features "bevy,webgpu"
        --locked
        --workspace
        --lib
        --examples
        --target wasm32-unknown-unknown
        --keep-going

  cargo-fmt:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Remove native build configuration
      run: rm .cargo/config.toml
    - name: Configure Rust
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: nightly-2025-09-17
        components: rustfmt
    - run: cargo +nightly-2025-09-17 fmt --all --check

  prek:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: prek
      uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2.0.5
      with:
        prek-version: '0.3.8'

  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
      with:
        advanced-security: false

  # This job is used to provide a single requirement for branch merge conditions.
  tests_complete:
    name: All style checks
    if: always()
    needs: [cargo-check-clippy, cargo-fmt, prek, zizmor]
    runs-on: ubuntu-24.04

    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< "${NEEDS}"
      env:
        NEEDS: ${{ toJson(needs) }}
    - run: exit 0
