[package]
name = "examples"
categories.workspace = true
description = "Collect examples that demonstrate how to use hoomd-rs."
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# Do not publish examples to crates.io
publish = false

# Use more relaxed lints in the examples.
[lints.clippy]
print_stdout = "allow"

[features]
bevy = ["dep:bevy", "dep:hoomd-bevy", "dep:bevy_egui"]
webgpu = ["hoomd-bevy/webgpu"]
doc-example = ["bevy", "hoomd-bevy/doc-example"]

[dependencies]
hoomd-bevy = { workspace =  true, optional = true }
hoomd-derive.workspace = true
hoomd-geometry.workspace = true
hoomd-gsd.workspace = true
hoomd-interaction.workspace = true
hoomd-manifold.workspace = true
hoomd-mc.workspace = true
hoomd-microstate.workspace = true
hoomd-simulation.workspace = true
hoomd-spatial.workspace = true
hoomd-utility.workspace = true
hoomd-vector.workspace = true

anyhow.workspace = true
bevy = { workspace = true, optional = true }
bevy_egui = { workspace = true, optional = true }
thiserror.workspace = true
parquet.workspace = true
parquet_derive.workspace = true
rand.workspace = true
strum.workspace = true
strum_macros.workspace = true

[[example]]
name = "hello"
path = "hello.rs"

[[example]]
name = "random-walk"
path = "mc-tutorial/random-walk.rs"

[[example]]
name = "custom-random-walk"
path = "mc-tutorial/custom-random-walk.rs"

