name: Interactive Examples

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
    - trunk

  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  build:
    name: Build [${{ matrix.example }}]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example:
        - applying-interactions
        - binary-hard-shapes
        - capsules-on-a-plane
        - crystal-stability
        - custom-random-walk
        - ellipse-gcmc-2d
        - hard-disk-self-assembly
        - hard-ellipse-self-assembly
        - hard-tetrahedron-self-assembly
        - lj-fluid
        - multi-site-patchy-shapes
        - patchy-body-2d
        - patchy-body-3d
        - patchy-particle-self-assembly
        - polydisperse-hard-disk-model
        - seeded-self-assembly
        - tetronimoes
        - type-dependent-interactions

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Remove native build configuration
      run: rm .cargo/config.toml
    - name: Configure Rust
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
      with:
        toolchain: 1.100.0
        targets: wasm32-unknown-unknown
    - name: Check rust installation
      run: rustc -vV
    - name: Install cargo-binstall
      run: curl -sSL "https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-gnu.tgz" | tar -xvz --directory "$HOME/.cargo/bin"
    - name: Install wasm-bindgen
      run: cargo binstall wasm-bindgen-cli@0.2.130 --no-confirm --disable-strategies=compile --disable-telemetry
    - name: Install binaryen
      run: curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz" | tar -xvz --strip-components 2 --directory "$HOME/.cargo/bin"

    # rust-cache already includes a Cargo.lock hash in the key. However, it
    # eagerly restores caches with previous Cargo.lock files. This causes
    # multiple builds to be cached in target/ increasing the cache usage
    # dramatically. Add the Cargo.lock hash again in the key portion to
    # prevent this restoration.
    - name: Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: wasm32-unknown-unknown-${{ hashFiles('Cargo.lock') }}
        cache-bin: false
        save-if: ${{ github.ref != 'refs/heads/trunk' && matrix.example == 'applying-interactions' }}

    - name: Create output directory
      run: mkdir -p web

    - name: Build examples
      run: >
        cargo run
        --locked
        -p build-wasm-doc-examples
        --
        --reduce-size
        --root web
        ${{ matrix.example }}

    - name: Show target directory size
      run: du -hsc target/*

    - name: Show web directory size
      run: du -hsc web/*

    - name: Web directory contents
      run: ls -lR web

    - name: Upload example
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: web-${{ matrix.example }}
        path: web

  collect:
    name: Collect built examples
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        merge-multiple: 'true'
        pattern: web-*

    - name: Show web directory size
      run: du -hsc web/*

    - name: Web directory contents
      run: ls -lR web

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ./web

  deploy:
    name: Deploy

    permissions:
      contents: read
      pages: write
      id-token: write

    needs: collect

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/trunk'
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  tests_complete:
    name: All WASM example builds
    if: always()
    needs: [build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - run: jq --exit-status 'all(.result == "success")' <<< "${NEEDS}"
      env:
        NEEDS: ${{ toJson(needs) }}
    - name: Done
      run: exit 0
